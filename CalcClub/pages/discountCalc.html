<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Discount Calculator</title>
  </head>
  <body>
    <div class="container">
      <div class="inputDiv">
        <label for="orignalPriceInput" class="orignalPrice">
          Orignal Price</label
        >
        <input type="text" name="" id="" required class="orignalPriceInput" />
        <label for="discountPer">Discount(%)</label>
        <input type="text" name="" id="" required class="discountPer" />
      </div>
      <div class="buttons">
        <button class="calc">Calculate</button>
        <button class="clear">Clear</button>
        <button class="copy">Copy</button>
      </div>
      <div class="resultDiv">
        <label for="resultBox">Result</label>
        <div class="discAmount">
          <label for="discountedAmount"> Discount Amount</label>
          <input type="text" name="" id="" class="discountedAmount" />
        </div>
        <div class="finAmount">
          <label for="finalAmount"> Final Amount</label>
          <input type="text" name="" id="" class="finalAmount" />
        </div>
      </div>
    </div>
  </body>
  <script src="../js/discountCalc.js"></script>
</html>
