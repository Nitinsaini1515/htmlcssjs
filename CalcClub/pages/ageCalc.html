<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Age Calculator</title>
</head>
<body>
  <div class="container">
    <div>Age Calculator</div>
    <div class="inputDiv">
      <label for="dob">Date of birth</label>
      <input class="dob" type="date" name="" id="">
      <label for="" >Current/Target Date</label>
      <input type="date" name="" id="" class="targetDate">
    </div>
    <div class="buttons">
      <button class="calcAge">Calculate Age</button>
    </div>
    <div class="resultBox">
      <div class="result">Years months days</div>
      <div class="yourLifeTime">Your Life Time</div>
      <div class="yourLifeTimeReuslt"></div>
    </div>
  </div>
</body>
<script src="../js/ageCalc.js"></script>
</html>
