<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emi Calculator</title>
</head>
<body>
  
<div class="container">

  <div class="inputBox">
    <label for="loanAmount">Loan Amount</label>
    <input type="text" name="" id="" class="loanAmount">
    <label for="annualInterest">Annual Interest </label>
    <input type="text" name="" id="" class="annualInterest">
    <label for="loanTensure">Loan Tensure</label>
    <input type="text" name="" id="" class="loanTensure">
  </div>
  <div class="resultBox">
    <button class="resultButton">Calculate</button>
    <label for="monthlyEmi">Monthly EMI</label>
    <input type="text" class="monthlyEmi">
    <label for="totalInterest">Total Interest</label>
    <input type="text" class="totalInterest">
    <label for="totalPayment">Total Payment</label>
    <input type="text" class="totalPayment">
  </div>
</div>


</body>
</html>
