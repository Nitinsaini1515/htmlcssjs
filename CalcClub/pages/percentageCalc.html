<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Percantage Calculator</title>
</head>
<body>


  <div class="conatinerOne">
    <!-- Find Percentage -->
     <div class="basicPercentage">

      <div class="inputDiv">
        <label for="numberOne">Number</label>
         <input type="text" required class="numberOne" >
         <label  for="numberTwo">Percentage</label>
         <input required type="text" class="numberTwo">
      </div>
        <button class="resultOne"> Calculate</button>
        <input type="text" id="ansBoxOne" readonly>
     </div>


    
  </div>

  <div class="containerTwo">

  <div class="partPercentage">

      <div class="inputDivTwopart">
        <label for="numberOnePart">Part</label>
         <input type="text" required class="numberOnePart" >
         <label  for="numberTwoPart">Total</label>
         <input required type="text" class="numberTwoPart">
      </div>
        <button class="resultOnePart"> Calculate</button>
        <input type="text" id="ansBoxOnePart" readonly>
     </div>


  </div>


  <!-- Increase Decrease Calculator -->

  <div class="containerThree">
    
    <div class="incDecPercentage">
      <div class="inputDivIncDec">
        <label for="numberOneIncDec">Part</label>
         <input type="text" required class="numberOneIncDec" >
         <label  for="numberTwoIncDec">Total</label>
         <input required type="text" class="numberTwoIncDec">
      </div>
        <button class="resultIncDec"> Calculate</button>
        <input type="text" id="ansBoxIncDec" readonly>
     </div>

  </div>


  <div class="containerFour">
    
    <div class="diffDiv">
      <div class="inputDivDiff">
        <label for="numberOneDiff">Part</label>
         <input type="text" required class="numberOneDiff" >
         <label  for="numberTwoDiff">Total</label>
         <input required type="text" class="numberTwoDiff">
      </div>
        <button class="resultDiff"> Calculate</button>
        <input type="text" id="ansBoxDiff" readonly>
     </div>

  </div>

</body>
<script src="../js/percentageCalc.js"></script>
</html>
